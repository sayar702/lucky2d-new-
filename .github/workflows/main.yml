name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create basic Android project structure
      run: |
        mkdir -p app/src/main
        echo 'android { namespace "com.example.lucky2d" compileSdk 34 defaultConfig { applicationId "com.example.lucky2d" minSdk 24 targetSdk 34 versionCode 1 versionName "1.0" } }' > app/build.gradle
        echo 'include ":app"' > settings.gradle

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug || true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

